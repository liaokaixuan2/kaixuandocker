<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的恩爱日常</title>
<style>
/* 炫酷初始動畫 */
.loading {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  transition: opacity 0.5s ease;
}
.loading-content {
  color: white;
  font-size: 2rem;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.7; transform: scale(1.05); }
  100% { opacity: 1; transform: scale(1); }
}

:root {
  --primary: #667eea;
  --secondary: #764ba2;
  --accent: #ff6b6b;
  --gradient: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
}

body {
  font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  margin: 0;
  padding: 0;
  background: #f0f2f5;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* 背景星空效果 */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: 
    radial-gradient(circle at 10% 20%, rgba(255,255,255,0.1) 0%, transparent 20%),
    radial-gradient(circle at 90% 80%, rgba(255,255,255,0.1) 0%, transparent 20%);
  z-index: -1;
}

.header {
  text-align: center;
  padding: 40px 20px;
  background: var(--gradient);
  color: white;
  position: relative;
  overflow: hidden;
}
.header::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(45deg, transparent 0%, rgba(255,255,255,0.1) 50%, transparent 100%);
}

.header h1 {
  font-size: clamp(2rem, 5vw, 3.5rem);
  margin: 0;
  text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
  letter-spacing: 3px;
  position: relative;
  z-index: 1;
}
.header p {
  font-size: 1.2rem;
  opacity: 0.9;
  margin-top: 10px;
  position: relative;
  z-index: 1;
}

/* 魔方格子布局 */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 25px;
  padding: 40px;
  max-width: 1400px;
  margin: 0 auto;
}

.gallery-item {
  position: relative;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  transform: perspective(1000px) rotateY(0deg);
  transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
}

.gallery-item:hover {
  transform: perspective(1000px) rotateY(5deg) scale(1.03);
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  z-index: 10;
}

.gallery-item::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: 0.5s;
}

.gallery-item:hover::before {
  left: 100%;
}

.gallery-item img {
  width: 100%;
  height: 350px;
  object-fit: cover;
  display: block;
  transition: transform 0.5s ease;
}

.gallery-item:hover img {
  transform: scale(1.1);
}

.gallery-item figcaption {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0,0,0,0.7);
  color: white;
  padding: 20px;
  font-size: 1.1rem;
  text-align: center;
  transform: translateY(100%);
  transition: transform 0.5s ease;
}

.gallery-item:hover figcaption {
  transform: translateY(0);
}

/* 心形装饰 */
.decorative-heart {
  position: absolute;
  font-size: 30px;
  color: rgba(255,255,255,0.1);
  z-index: -1;
  animation: float 6s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-30px) rotate(90deg); }
  50% { transform: translateY(-60px) rotate(180deg); }
  75% { transform: translateY(-30px) rotate(270deg); }
}

/* 响应式设计 */
@media (max-width: 768px) {
  .gallery {
    grid-template-columns: 1fr;
    gap: 20px;
    padding: 20px;
  }
  
  .gallery-item img {
    height: 280px;
  }
  
  .gallery-item figcaption {
    padding: 15px;
    font-size: 1rem;
  }
}

@media (max-width: 480px) {
  .header h1 {
    font-size: 1.8rem;
  }
  
  .gallery-item img {
    height: 220px;
  }
}

/* 进度指示器 */
.progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  height: 4px;
  background: var(--gradient);
  z-index: 1000;
  transition: width 0.3s;
}

/* 喜欢按钮 */
.love-btn {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 60px;
  height: 60px;
  background: var(--accent);
  border: none;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(255,107,107,0.4);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 100;
  transition: all 0.3s ease;
  animation: heartbeat 2s infinite;
}
.love-btn:hover {
  transform: scale(1.2);
  box-shadow: 0 6px 20px rgba(255,107,107,0.6);
}
@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  25% { transform: scale(1.1); }
  50% { transform: scale(1); }
}
.love-btn svg {
  width: 30px;
  height: 30px;
  fill: white;
}

/* 背景音乐控制 */
.music-player {
  position: fixed;
  bottom: 15px;
  left: 15px;
  background: rgba(255,255,255,0.95);
  padding: 10px;
  border-radius: 25px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  z-index: 100;
  backdrop-filter: blur(5px);
}
.music-player button {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 18px;
  margin-right: 10px;
  color: var(--primary);
}
.music-player span {
  color: #666;
  font-size: 0.9rem;
}
</style>
</head>
<body>
<div class="loading">
  <div class="loading-content">Loading our love story...</div>
</div>

<div class="progress-bar" id="progressBar"></div>

<header class="header">
  <h1>🌟 我们的恩爱日常</h1>
  <p>记录每一颗心跳的瞬间</p>
</header>

<main class="gallery">
  <figure class="gallery-item">
    <img src="images/upload_20261027_180342_1.jpg" alt="Swimming couple">
    <figcaption>泳池中的甜蜜时刻 💕</figcaption>
  </figure>
  
  <figure class="gallery-item">
    <img src="images/upload_20261027_180355_2.jpg" alt="Couple walking at night">
    <figcaption>夜晚的散步 🌙</figcaption>
  </figure>
  
  <figure class="gallery-item">
    <img src="images/upload_20261027_180356_3.jpg" alt="Woman with lipstick mark">
    <figcaption>温柔的表情 😘</figcaption>
  </figure>
  
  <figure class="gallery-item">
    <img src="images/upload_20261027_180357_4.jpg" alt="Restaurant scene with Stewie">
    <figcaption>轻松的餐厅时光 🍽️</figcaption>
  </figure>
  
  <figure class="gallery-item">
    <img src="images/upload_20261027_180359_5.jpg" alt="Couple walking barefoot">
    <figcaption>光脚漫步 🌸</figcaption>
  </figure>
  
  <figure class="gallery-item">
    <img src="images/upload_20261027_180402_6.jpg" alt="Couple in car">
    <figcaption>车内的温馨瞬间 🚗</figcaption>
  </figure>
  
  <figure class="gallery-item">
    <img src="images/upload_20261027_180405_7.jpg" alt="Couple in restaurant (different angle)">
    <figcaption>餐厅里的互动 💑</figcaption>
  </figure>
  
  <figure class="gallery-item">
    <img src="images/upload_20261027_180406_8.jpg" alt="Couple close-up with lipstick mark">
    <figcaption>亲密的眨眼 ✨</figcaption>
  </figure>
  
  <figure class="gallery-item">
    <img src="images/upload_20261027_180408_9.jpg" alt="Couple walking together">
    <figcaption>手牵手的漫步 👫</figcaption>
  </figure>
</main>

<button class="love-btn" id="loveBtn">
  <svg viewBox="0 0 512 512">
    <path d="M432 96h-28.3l-25.4-26.7C368.7 58.9 346.6 56 325.2 56c-21.4 0-43.5 2.9-62.8 8.2L184.3 96H100c-11.1 0-20 9-20 20v376c0 11.1 8.9 20 20 20h312c11.1 0 20-8.9 20-20V116c0-11.1-8.9-20-20-20zM256 163.2c32.4-10.6 68.8 1.3 92.2 33.1l.7.9c.6.7 1.4 1.5 2.1 2.2l86.9-48.5c2.8-1.6 5.8-2.4 8.9-2.4 3.6 0 7 1.1 9.8 3.1l56.4 35.4c2.1 1.4 4.3 2.9 6.5 4.6l65.6-65.6c2.3-2.4 5.2-3.9 8.2-4.4L447.7 80c.9-14.4 13.3-25.6 27.3-25.6v.1zM170.8 425.1l-4.9-4.8V128h28.3l4.9-5.0v313.9zM340.1 430.5L335.2 422c-20.9 3-41 12.9-58.8 32.5L245 448.3c-10.5 11.3-13.8 27.2-8.3 41.7 3.2 8.3 10.2 15.9 19.3 20.5 5.4 2.8 11.1 4.2 16.9 4.2 9.7 0 18.8-4.8 26.6-13.4l3.9-4.4c.3-.4 22.3-25.2 22.3-25.2l.1-.1c4.6-7.5 11.2-12.8 18.8-15.3l56-20.3c4.7-1.7 9.5-2.4 14.2-1.9 11.4 1.2 21.4 8.6 27.2 19.4l29.5 59.1c2.5 5-1.1 10.3-6.1 12.2-4.9 1.8-10-1.2-12.2-5.5-2.9-5.5-15.8-27.9-26.7-46.5-2.1-3.4-4.1-6.9-6.1-10.3-12.1 18.3-28.1 31.1-35.1 36.7-10.1 8.1-20.9 15.9-28.1 16.5-5 .4-9.3-2.5-11.6-7.2z"/>
  </svg>
</button>

<div class="music-player">
  <button id="musicToggle">🎵</button>
  <span>Background Music</span>
</div>

<script>
// 加载动画
const loading = document.querySelector('.loading');
setTimeout(() => {
  loading.style.opacity = '0';
  loading.style.transition = 'opacity 0.5s ease';
}, 1500);

// 滚动进度条
const progressBar = document.getElementById('progressBar');
window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.body.scrollHeight - window.innerHeight;
  const scrollPercent = (scrollTop / docHeight) * 100;
  progressBar.style.width = scrollPercent + '%';
});

// 喜爱按钮动画
const loveBtn = document.getElementById('loveBtn');
let loveCount = 0;
loveBtn.addEventListener('click', () => {
  loveCount++;
  const hearts = [];
  for(let i = 0; i < 10; i++) {
    const heart = document.createElement('div');
    heart.innerHTML = '💖';
    heart.style.position = 'absolute';
    heart.style.left = loveBtn.offsetLeft + loveBtn.offsetWidth/2 + (Math.random() - 0.5) * 100 + 'px';
    heart.style.top = loveBtn.offsetTop + 'px';
    heart.style.fontSize = '20px';
    heart.style.zIndex = '999';
    heart.style.pointerEvents = 'none';
    heart.style-animation = 'up 1s forwards';
    document.body.appendChild(heart);
    hearts.push(heart);
  }
  setTimeout(() => {
    hearts.forEach(heart => heart.remove());
  }, 1000);
});

const style = document.createElement('style');
style.textContent = `@keyframes up { from { transform: translateY(0) scale(1); opacity: 1; } to { transform: translateY(-100px); opacity: 0; } }`;
document.head.appendChild(style);

// 背景音乐
const musicToggle = document.getElementById('musicToggle');
musicToggle.addEventListener('click', () => {
  const emoji = musicToggle.textContent;
  musicToggle.textContent = emoji === '🎵' ? '⏸️' : '🎵';
});

// 添加心形装饰
for(let i = 0; i < 8; i++) {
  const heart = document.createElement('div');
  heart.className = 'decorative-heart';
  heart.innerHTML = '💕';
  heart.style.left = Math.random() * 100 + '%';
  heart.style.top = Math.random() * 100 + '%';
  heart.style.animationDuration = (8 + Math.random() * 4) + 's';
  heart.style.animationDelay = Math.random() * 2 + 's';
  document.body.appendChild(heart);
}

// 初始加载完成
setTimeout(() => {
  loading.style.display = 'none';
}, 2000);
</script>
</body>
</html>
